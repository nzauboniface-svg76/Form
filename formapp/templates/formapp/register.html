
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://picsum.photos/1600/900');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(3px);
    }

    .form-container {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      width: 250px;
      height: 250px;
      color: white;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      position: relative;
      z-indeax: 1;
      overflow: visible;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      color: #00bfff;
      margin-bottom: 20px;
    }

    hr {
      border: 1px solid #00bfff;
      margin-bottom: 20px;
    }
    .ring {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .ring span {
      position: absolute;
      left: 0;
      width: 8px;
      height: 8px;
      border-radius: 5%;
      background: #2c4766;
      transform-origin: 150px;
      transform: scale(2.2) rotate(calc(var(--i)*7.2deg));
      animation: animateBlink 3s linear infinite;
      animation-delay: calc(var(--i)*(3s/ 50));
    }
    @keyframes animateBlink {
      0% {background: #00f;}
      25% {background: light blue;}
      100% {background: white;}
    }
    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group input {
      position: absolute;
      top: 1%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-bottom: 2px solid #00bfff;
      background: transparent;
      color: #fff;
      outline: none;
    }

    .input-group label {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      pointer: cursor;
      transition: 0.3s;
    }

    .input-group input:focus + label,
    .input-group input:valid + label {
      top: -15px;
      left: 0;
      color: #00bfff;
      font-size: 14px;
    }

    .link {
      color: #00ffb3;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      background-color: #00bfff;
      color: white;
      font-size: 16px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn:hover {
      background-color: #0080ff;
    }

    .print-btn {
      display: block;
      margin: 15px auto 0;
      background-color: #1eeb92;
      color: black;
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .print-btn:hover {
      background-color: #17c178;
    }

    label a {
      display: inline-block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Register</h1>
    <hr>
    <div class="ring">
      <span style="--i:1"></span>
      <span style="--i:2"></span>
      <span style="--i:3"></span>
      <span style="--i:4"></span>
      <span style="--i:5"></span>
      <span style="--i:6"></span>
      <span style="--i:7"></span>
      <span style="--i:8"></span>
      <span style="--i:9"></span>
      <span style="--i:10"></span>
      <span style="--i:11"></span>
      <span style="--i:12"></span>
      <span style="--i:13"></span>
      <span style="--i:14"></span>
      <span style="--i:15"></span>
      <span style="--i:16"></span>
      <span style="--i:17"></span>
      <span style="--i:18"></span>
      <span style="--i:19"></span>
      <span style="--i:20"></span>
      <span style="--i:21"></span>
      <span style="--i:22"></span>
      <span style="--i:23"></span>
      <span style="--i:24"></span>
      <span style="--i:25"></span>
      <span style="--i:26"></span>
      <span style="--i:27"></span>
      <span style="--i:28"></span>
      <span style="--i:29"></span>
      <span style="--i:30"></span>
      <span style="--i:31"></span>
      <span style="--i:32"></span>
      <span style="--i:33"></span>
      <span style="--i:34"></span>
      <span style="--i:35"></span>
      <span style="--i:36"></span>
      <span style="--i:37"></span>
      <span style="--i:38"></span>
      <span style="--i:39"></span>
      <span style="--i:40"></span>
      <span style="--i:41"></span>
      <span style="--i:42"></span>
      <span style="--i:43"></span>
      <span style="--i:44"></span>
      <span style="--i:45"></span>
      <span style="--i:46"></span>
      <span style="--i:47"></span>
      <span style="--i:48"></span>
      <span style="--i:49"></span>
      <span style="--i:50"></span>
      <span style="--i:51"></span>
    </div>

    <form method="post" onsubmit="return validateForm()">
      {% csrf_token %}
      <div class="input-group">
        <input type="text" id="Name" name="username" required>
        <label for="Name">Full Name</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" name="email" required>
        <label for="email">E-mail</label>
      </div>

      <div class="input-group">
        <input type="tel" id="phone" name="phone" required>
        <label for="phone">Phone Number</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" required>
        <label for="password">Password</label>
      </div>

      <div class="input-group">
        <input type="password" id="confirm-password" name="confirm_password" required>
        <label for="confirm-password">Confirm Password</label>
      </div>
      <!-- Terms & Conditions Checkbox -->
      <div class="terms">
         <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">
        I have read, viewed, and agree to <strong>comply</strong> with the 
        <a href="{% url 'terms' %}" target="_blank">Terms & Conditions</a>.
        </label>
     </div>

      <button type="submit" class="register-btn">Submit Registration</button>
    </form>

    <p style="text-align:center; margin-top:12px; color:#fff;">
      Already have an account? <a class="link" href="{% url 'login' %}">Login</a>
    </p>

    <hr>
    <button class="print-btn" onclick="window.print()">Print Page</button>
  </div>

  <script>
    function validateForm() {
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm-password").value;
      if (pass !== confirm) {
        alert("Passwords do not match!");
        return false;
      }
      return true;
    }
  </script>
</body>

</html>
